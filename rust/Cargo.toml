[package]
name = "nobelog"
version = "0.0.23"
edition = "2024"
rust-version = "1.99"
description = "nobelog 静态博客生成器（Rust 重写）"

[[bin]]
name = "nobelog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
rayon = "1"
percent-encoding = "2"
indexmap = "2"
regex = "1"
pulldown-cmark = "0.13"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "compression-br"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
