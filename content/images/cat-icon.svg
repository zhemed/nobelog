<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="猫咪图标">
  <style>
    /* 暗色标签页里把黑线反成白线。SVG 里的位图元素是 image（不是 HTML 的 img），
       两个选择器都写上：img 是任务约定的写法，image 才是真正生效的那个。 */
    @media (prefers-color-scheme: dark) {
      img, image { filter: invert(1); }
    }
  </style>
  <image width="192" height="192" href="data:image/png;base64,"/>
</svg>
