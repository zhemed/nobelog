<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="站点图标">
  <style>
    .light { display: inline; }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="48" height="48" href="data:image/png;base64,"/>
  <image class="dark" width="48" height="48" href="data:image/png;base64,"/>
</svg>
